# net-solver: Nginx site config for a single EC2 instance (Ubuntu).
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/net-solver
#           sudo ln -sf /etc/nginx/sites-available/net-solver /etc/nginx/sites-enabled/net-solver
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
#
# Traffic:  Internet -> IGW -> SG(80) -> Nginx :80
#             /health  -> Nginx answers 200 "OK" itself (works even if Node is down)
#             /api/*   -> proxy to Node on 127.0.0.1:3000 (not reachable from outside)
#             else     -> static files from public/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/net-solver/public;
    index index.html;

    server_tokens off;                 # hide Nginx version in headers / error pages
    client_max_body_size 10m;          # photo upload (base64 JSON); default 1m would give 413

    access_log /var/log/nginx/net-solver.access.log;
    error_log  /var/log/nginx/net-solver.error.log warn;

    # Health check answered by Nginx directly: proves IGW/route/SG/Nginx path without touching Node.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Only /api/ reaches the Node server.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;      # Node down -> fast 502 instead of hanging
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;    # analysis takes 1-2 min; default 60s would give 504
    }

    # Never serve dotfiles (.env, .git) even if they end up under root by mistake.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
